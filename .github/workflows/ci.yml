name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # No Supabase/Groq secrets are configured here on purpose: the build
      # doesn't need real credentials to succeed (missing env vars just
      # fall back to a placeholder client at runtime), so CI stays free to
      # run with no repo secrets to manage.
      - run: npm run build
